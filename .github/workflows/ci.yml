name: CI Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test_and_build:
    name: Backend Tests, E2E Acceptance & Frontend Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install Backend Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest pytest-asyncio anyio

      - name: Run Unit Tests
        env:
          SUPABASE_URL: https://mock.supabase.co
          SUPABASE_SERVICE_ROLE_KEY: mock-service-key
          JWT_SECRET: mock-jwt-secret
        run: |
          PYTHONPATH=. pytest -v -m "not e2e and not live_llm"

      - name: Validate Dedicated E2E Database Configuration
        env:
          E2E_SUPABASE_URL: ${{ secrets.E2E_SUPABASE_URL }}
          E2E_SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.E2E_SUPABASE_SERVICE_ROLE_KEY }}
          PRODUCTION_SUPABASE_URL: ${{ secrets.PRODUCTION_SUPABASE_URL }}
        run: |
          if [ -z "$E2E_SUPABASE_URL" ]; then
            echo "::error::Missing GitHub Actions secret E2E_SUPABASE_URL"
            exit 1
          fi
          if [ -z "$E2E_SUPABASE_SERVICE_ROLE_KEY" ]; then
            echo "::error::Missing GitHub Actions secret E2E_SUPABASE_SERVICE_ROLE_KEY"
            exit 1
          fi
          if [ -z "$PRODUCTION_SUPABASE_URL" ]; then
            echo "::error::Missing GitHub Actions secret PRODUCTION_SUPABASE_URL"
            exit 1
          fi
          if [ "$E2E_SUPABASE_URL" = "$PRODUCTION_SUPABASE_URL" ]; then
            echo "::error::E2E Supabase project must be different from production."
            exit 1
          fi
          case "$E2E_SUPABASE_URL" in
            *mock.supabase.co*|*placeholder*)
              echo "::error::E2E Supabase URL cannot be a mock or placeholder."
              exit 1
              ;;
          esac

      - name: Run Deterministic E2E Acceptance Suite
        env:
          SUPABASE_URL: ${{ secrets.E2E_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.E2E_SUPABASE_SERVICE_ROLE_KEY }}
          PRODUCTION_SUPABASE_URL: ${{ secrets.PRODUCTION_SUPABASE_URL }}
          E2E_DB_CONFIRM: "1"
          JWT_SECRET: mock-jwt-secret
        run: |
          PYTHONPATH=. pytest tests/e2e -v -s -m "e2e and not live_llm"

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: "frontend/package-lock.json"

      - name: Install Frontend Dependencies
        working-directory: ./frontend
        run: npm ci || npm install

      - name: Build Frontend Application
        working-directory: ./frontend
        run: npm run build

      - name: Upload E2E Test Artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-test-results
          path: test-results/
