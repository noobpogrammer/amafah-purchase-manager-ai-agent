name: Phase 2 supplier workflow checks
on:
  pull_request:
    paths:
      - 'main.py'
      - 'db.py'
      - 'openclaw_bridge.py'
      - 'tests/test_activation_policy.py'
      - 'supplier_message_planner.py'
      - 'tests/test_supplier_message_planner.py'
      - 'supabase/migrations/*revision_pending.sql'
      - '.github/workflows/phase2-supplier-workflow.yml'
  push:
    branches:
      - 'feat/phase2-bundle-revision-multiitem-20261012'
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Check Python syntax
        run: python -m compileall -q main.py db.py openclaw_bridge.py groq_client.py supplier_message_planner.py
      - name: Execute deterministic supplier workflow tests
        run: python -m unittest discover -s tests -p 'test_supplier_message_planner.py' -v
      - name: Install backend dependencies
        run: python -m pip install -r requirements.txt
      - name: Run API-level multi-RFQ integration tests
        env:
          SUPABASE_URL: https://localhost.supabase.co
          SUPABASE_SERVICE_ROLE_KEY: phase2-ci-placeholder
          GROQ_API_KEY: phase2-ci-placeholder
          OPENCLAW_TOOL_API_KEY: phase2-test-tool-key
        run: python -m unittest discover -s tests -p 'test_phase2_bridge.py' -v
      - name: Run Option C activation gate tests
        env:
          SUPABASE_URL: https://localhost.supabase.co
          SUPABASE_SERVICE_ROLE_KEY: phase2-ci-placeholder
          GROQ_API_KEY: phase2-ci-placeholder
          OPENCLAW_TOOL_API_KEY: phase2-test-tool-key
        run: python -m unittest discover -s tests -p 'test_activation_policy.py' -v
      - name: Set up Node for frontend build
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json
      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci
      - name: Build frontend
        working-directory: frontend
        run: npm run build
